<svg xmlns="http://www.w3.org/2000/svg" width="440" height="730" viewBox="0 0 440 730" role="img" aria-labelledby="title desc">
<title id="title">VSH three-layer application security workflow</title>
<desc id="desc">L1 detection, L2 LLM explanation, optional L3 PoC generation and verification, followed by UI and report output.</desc>
<rect width="440" height="730" fill="#FAFAF8"/>
<rect x="1" y="1" width="438" height="728" fill="none" stroke="#D1D3D2"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="22" y="41" font-size="30" font-weight="700" fill="#1C1D1F">VSH</text>
<text x="94" y="41" font-size="15" fill="#4D5254">APPLICATION SECURITY</text>
<path d="M22 59H418" stroke="#8D9294"/>
<text x="22" y="86" font-size="17" fill="#505559">INPUT / Source code + dependencies</text>
<g>
<rect x="22" y="107" width="396" height="123" fill="#FFFFFF" stroke="#A8ADAF" stroke-width="1.4"/>
<rect x="22" y="270" width="396" height="123" fill="#FFFFFF" stroke="#A8ADAF" stroke-width="1.4"/>
<rect x="22" y="433" width="396" height="148" fill="#F5F5F2" stroke="#7E8386" stroke-width="1.4" stroke-dasharray="7 5"/>
</g>
<text x="42" y="138" font-size="16" font-weight="700" fill="#707578" letter-spacing="1.5">01 / L1</text>
<text x="42" y="171" font-size="26" font-weight="700" fill="#141618">Static detection</text>
<text x="42" y="207" font-size="17" fill="#54595C">Semgrep / rules / SBOM</text>
<text x="42" y="301" font-size="16" font-weight="700" fill="#707578" letter-spacing="1.5">02 / L2</text>
<text x="42" y="334" font-size="26" font-weight="700" fill="#141618">LLM explanation</text>
<text x="42" y="370" font-size="17" fill="#54595C">Reasoning / attack scenario / fix</text>
<text x="42" y="464" font-size="16" font-weight="700" fill="#707578" letter-spacing="1.5">03 / L3 · OPTIONAL</text>
<text x="42" y="496" font-size="24" font-weight="700" fill="#141618">PoC generation</text>
<text x="42" y="524" font-size="24" font-weight="700" fill="#141618">&amp; verification</text>
<text x="42" y="556" font-size="16" fill="#54595C">Real end-to-end result not yet proven</text>
<g stroke="#292E30" stroke-width="2" fill="none">
<path d="M220 235V263M213 256L220 263L227 256"/>
<path d="M220 398V426M213 419L220 426L227 419" stroke-dasharray="5 4"/>
</g>
<path d="M22 608H418" stroke="#A8ADAF"/>
<text x="22" y="640" font-size="21" font-weight="700" fill="#141618">OUTPUT / Findings and reports</text>
<text x="22" y="671" font-size="16" fill="#54595C">L2 may use mock data in local demos.</text>
<text x="22" y="694" font-size="16" fill="#54595C">L3 remains optional and partly unverified.</text>
</g>
</svg>