name: Unit tests and desktop build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  runtime-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VSH_Project_MVP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: VSH_Project_MVP/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test all unit contracts
        run: python -m pytest tests/unit -q
  desktop-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VSH_Project_MVP/vsh_desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: VSH_Project_MVP/vsh_desktop/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
